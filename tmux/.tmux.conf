set -g default-terminal "screen-256color"

set -s escape-time 0
set -g mode-keys vi
set -g mouse on

bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"
bind R run-shell -b "~/.config/tmux/pane-bg.sh" \; display "Repainted pane backgrounds!"

set -g set-titles on
set -g set-titles-string pane_current_command

set -g status-interval 1

set -g activity-action any
set -g visual-activity on

set -g history-limit 100000


# ── per-pane background ──────────────────────────────────────
# Colour a pane by what's running in it: an ssh host, or a Claude Code session.
# The decision lives in ~/.config/tmux/pane-bg.sh — a script rather than a .conf
# sourced by the hooks, because these hooks fire on every window rename and a
# source-file per fire trips tmux's "Too many nested files" limit.
#
# window-renamed alone is not enough: it only fires when the window name actually
# changes, so starting Claude in an already-named window would never trigger it.
set-hook -gu window-renamed
set-hook -gu pane-focus-in
set-hook -gu after-split-window
set-hook -g  window-renamed     'run-shell -b "~/.config/tmux/pane-bg.sh #{pane_id} #{pane_current_command} #{pane_tty} #{window-style}"'
set-hook -g  pane-focus-in      'run-shell -b "~/.config/tmux/pane-bg.sh #{pane_id} #{pane_current_command} #{pane_tty} #{window-style}"'
set-hook -g  after-split-window 'run-shell -b "~/.config/tmux/pane-bg.sh #{pane_id} #{pane_current_command} #{pane_tty} #{window-style}"'

# Also apply to the current pane on config reload, so `prefix + r` repaints the
# pane you're sitting in — the one case no hook covers (start Claude, stay put).
run-shell -b "~/.config/tmux/pane-bg.sh #{pane_id} #{pane_current_command} #{pane_tty} #{window-style}"


set -g allow-set-title off

# Panes
set -g pane-border-status top
# set -g pane-border-format " #{pane_index}: #{pane_title} "
set -g pane-border-format "#{?pane_active,#[fg=colour121]#[bold],#[fg=colour250]} #{pane_index}: #{pane_title} #[default]"
set -g pane-border-style "bg=colour235,fg=colour238"
# set -g pane-active-border-style "bg=colour235,fg=colour39"
set -g pane-active-border-style "bg=colour235,fg=colour121"

# Status bar
set -g status on

# set -g status-utf8 on
set -g status-justify left
set -g status-left-length 70

set -g status-style "bg=colour236,fg=colour145"
set -g status-left "#[bg=colour114,fg=colour236,none] ⇆ #[bg=colour236,none] "
set -g status-right " "

# Window list — highlight the currently selected window
set -g window-status-current-style "bg=colour214,fg=colour236,bold"
set -g window-status-style "bg=colour236,fg=colour145"
set -g window-status-current-format " #I:#W#F "
set -g window-status-format " #I:#W#F "

# Window style
#set -g window-style 'fg=colour247,bg=colour236'
#set -g window-style 'bg=colour236'
#set -g window-active-style 'bg=black'

# ------  Key Bindings  ------
# ---  Movement  ---
# vim key movements
bind      h     select-pane -L
bind      j     select-pane -D
bind      k     select-pane -U
bind      l     select-pane -R

# vim key movement without control key using alt
bind -n M-h     select-pane -L
bind -n M-j     select-pane -D
bind -n M-k     select-pane -U
bind -n M-l     select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# switch windows
bind -n M-L     next-window
bind -n M-H     previous-window

# splits and new windows
bind      s     split-window    -c "#{pane_current_path}"
bind      v     split-window -h -c "#{pane_current_path}"
bind      n     new-window      -c "#{pane_current_path}"
