# Set a pane's background from what's running in it.
# Sourced from several hooks in ~/.tmux.conf — see the pane background section there.
#
# ssh wins over Claude: a pane on a remote host keeps the remote colour even if
# Claude Code is running there.
#
# Claude is matched on the argv of everything on the pane's tty, not on
# #{pane_current_command}, because pane_current_command is unreliable here:
#   - the native installer runs ~/.local/share/claude/versions/<version>, so it
#     reports a bare version number ("2.1.247"), never "claude"
#   - panes launched through the safehouse sandbox wrapper report "bash"
# The pattern wants a real invocation — "…/bin/claude", bare "claude", or the npm
# install's "…/claude-code/cli.js" — so it ignores panes that merely mention the
# word (rg claude, vim .../claude/foo.sh, cat ~/.claude/settings.json).
# [c]laude keeps grep from matching its own process.
if-shell -F '#{m:*ssh*,#{pane_current_command}}' {
    set -p window-style "bg=#111111"
} {
    if-shell "ps -o args= -t #{pane_tty} | grep -qE '(^|/)[c]laude( |$)|/[c]laude-code/'" {
        set -p window-style "bg=#111611"
    } {
        set -p window-style none
    }
}
